<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>个人 AI 解决方案库</title>
  <style>
    :root {
      --bg: #f5f1e8;
      --panel: #fffdf8;
      --ink: #222222;
      --muted: #6a6257;
      --line: #d8cdbd;
      --brand: #c7642f;
      --brand-soft: #f3d4c2;
      --ok: #2b6b4a;
      --warn: #8f5a12;
      --bad: #9d2f2f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "PingFang SC", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, #fff3d9 0, transparent 26%),
        linear-gradient(180deg, #f8f3ea 0%, var(--bg) 100%);
    }
    .wrap {
      width: min(1240px, calc(100% - 32px));
      margin: 28px auto 48px;
    }
    .footer-link {
      margin-top: 18px;
      text-align: right;
    }
    .footer-link a {
      color: var(--brand);
      text-decoration: none;
      font-weight: 600;
    }
    .footer-link a:hover {
      text-decoration: underline;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      margin-bottom: 20px;
    }
    h1 { margin: 0 0 8px; font-size: 34px; }
    .lead { margin: 0; color: var(--muted); }
    .toggle {
      background: rgba(255,253,248,.92);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 280px;
      box-shadow: 0 10px 30px rgba(89, 66, 25, 0.06);
    }
    .top-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: flex-end;
      align-items: stretch;
    }
    .toggle input { width: 18px; height: 18px; }
    .grid {
      display: grid;
      grid-template-columns: 1.15fr 0.95fr;
      gap: 20px;
    }
    .grid.single-column {
      grid-template-columns: 1fr;
    }
    .card {
      background: rgba(255, 253, 248, 0.92);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(89, 66, 25, 0.06);
    }
    .stack {
      display: grid;
      gap: 20px;
    }
    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 12px;
      margin-bottom: 10px;
    }
    .section-head h2 { margin: 0; }
    .toolbar {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 12px;
      align-items: end;
      margin-bottom: 12px;
    }
    label {
      display: block;
      margin: 0 0 6px;
      font-weight: 600;
    }
    input, button, select {
      width: 100%;
      font: inherit;
      border-radius: 12px;
    }
    input, select {
      border: 1px solid var(--line);
      background: #fff;
      padding: 10px 12px;
    }
    button {
      border: 0;
      background: var(--brand);
      color: #fff;
      padding: 12px 14px;
      cursor: pointer;
      font-weight: 700;
    }
    button.secondary {
      background: #efe5d9;
      color: var(--ink);
    }
    button.danger {
      background: #b6453f;
      color: #fff;
    }
    .status {
      margin-bottom: 12px;
      padding: 10px 12px;
      border-radius: 12px;
      display: none;
    }
    .status.show { display: block; }
    .status.ok { background: #e7f4ec; color: var(--ok); }
    .status.warn { background: #fff2de; color: var(--warn); }
    .status.bad { background: #fde9e9; color: var(--bad); }
    .list { display: grid; gap: 14px; }
    .pager {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 10px;
      margin-top: 14px;
    }
    .pager button {
      width: auto;
      min-width: 96px;
    }
    .section-toggle {
      width: auto;
      min-width: 160px;
    }
    .hidden-block {
      display: none !important;
    }
    .item {
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      background: #fff;
      position: relative;
    }
    .item-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: start;
    }
    .edit-form {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px dashed var(--line);
      display: grid;
      gap: 10px;
    }
    .edit-form[hidden] {
      display: none !important;
    }
    .edit-form textarea {
      min-height: 90px;
      width: 100%;
      font: inherit;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: #fff;
      padding: 10px 12px;
      resize: vertical;
    }
    textarea {
      min-height: 100px;
      width: 100%;
      font: inherit;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: #fff;
      padding: 10px 12px;
      resize: vertical;
    }
    .item h3 {
      margin: 0 0 8px;
      font-size: 19px;
    }
    .menu {
      position: relative;
    }
    .menu summary {
      list-style: none;
    }
    .menu summary::-webkit-details-marker {
      display: none;
    }
    .menu-trigger {
      width: 38px;
      min-width: 38px;
      padding: 8px 0;
      border-radius: 10px;
      background: #efe5d9;
      color: var(--ink);
      text-align: center;
      cursor: pointer;
      user-select: none;
      font-weight: 700;
      line-height: 1;
    }
    .menu[open] .menu-panel {
      display: grid;
    }
    .menu-panel {
      display: none;
      position: absolute;
      right: 0;
      top: 44px;
      min-width: 110px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fffdf8;
      box-shadow: 0 14px 30px rgba(89, 66, 25, 0.12);
      z-index: 10;
      gap: 8px;
    }
    .menu-panel button {
      width: 100%;
      padding: 10px 12px;
    }
    .meta, .tags, .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }
    .pill {
      background: var(--brand-soft);
      color: #7d3c17;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 13px;
    }
    .muted { color: var(--muted); font-size: 14px; }
    .preview {
      margin-top: 10px;
      padding: 12px;
      border-radius: 12px;
      background: #f8f2ea;
      color: #43392d;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 14px;
    }
    .solution-body {
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.6;
    }
    .insight {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px dashed var(--line);
    }
    .inline-toggle {
      margin-top: 12px;
      border: 1px dashed var(--line);
      border-radius: 12px;
      background: #fcf8f1;
    }
    .inline-toggle summary {
      cursor: pointer;
      padding: 10px 12px;
      font-weight: 600;
    }
    .inline-toggle .preview {
      margin-top: 0;
      border-radius: 0 0 12px 12px;
    }
    @media (max-width: 980px) {
      .topbar { flex-direction: column; align-items: stretch; }
      .grid { grid-template-columns: 1fr; }
      .toolbar { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar" id="main-topbar">
      <div>
        <h1>个人 AI 解决方案库</h1>
        <p class="lead">把 AI 对话里验证有效的做法沉淀下来；未分析片段通过双击 Ctrl+C 进入待处理区。</p>
      </div>
      <div class="top-controls">
        <div class="toggle">
          <input type="checkbox" id="auto-analyze">
          <div>
            <strong>自动分析</strong>
            <div class="muted">开启后，Ctrl+C+C 抓取的片段会自动用 AI 分析并沉淀进知识库。</div>
          </div>
        </div>
        <button type="button" class="secondary section-toggle" id="toggle-pending-btn">显示未分析片段</button>
      </div>
    </div>

    <div class="stack">
      <section class="card hidden-block" id="config-section">
        <div class="section-head">
          <div>
            <h2>配置</h2>
            <div class="muted">设置 AI API Key、API URL 和模型。没有 API Key 时会优先显示这里。</div>
          </div>
        </div>
        <div id="config-status" class="status"></div>
        <form id="config-form" class="edit-form">
          <div>
            <label for="config-base-url">API URL</label>
            <input id="config-base-url" name="base_url" placeholder="https://api.openai.com/v1">
          </div>
          <div>
            <label for="config-api-key">API Key</label>
            <textarea id="config-api-key" name="api_key" placeholder="输入你的 API Key"></textarea>
          </div>
          <div>
            <label for="config-model">模型</label>
            <input id="config-model" name="model" placeholder="gpt-4o-mini">
          </div>
          <div class="actions">
            <button type="submit">保存配置</button>
          </div>
        </form>
      </section>

    <div class="grid" id="main-grid">
      <section class="card" id="knowledge-section">
        <div class="section-head">
          <div>
            <h2>已经沉淀的知识</h2>
            <div class="muted">这里展示已经进入知识库的结构化方案。</div>
          </div>
        </div>
        <div class="toolbar">
          <div>
            <label for="knowledge-q">关键词</label>
            <input id="knowledge-q" placeholder="搜索标题、问题、方案、标签">
          </div>
          <button type="button" class="secondary" id="knowledge-search-btn">刷新知识</button>
          <div></div>
        </div>
        <div id="knowledge-status" class="status"></div>
        <div id="knowledge-list" class="list"></div>
        <div class="pager">
          <button type="button" class="secondary" id="knowledge-prev-btn">上一页</button>
          <span class="muted" id="knowledge-page-info">第 1 页</span>
          <button type="button" class="secondary" id="knowledge-next-btn">下一页</button>
        </div>
      </section>

      <section class="card" id="pending-section">
        <div class="section-head">
          <div>
            <h2>没有分析过的片段</h2>
            <div class="muted">这里展示 Ctrl+C+C 抓取但尚未被 AI 分析的片段。</div>
          </div>
          <button type="button" class="danger" id="clear-pending-btn">清空未分析片段</button>
        </div>
        <div id="pending-content">
        <div class="toolbar">
          <div>
            <label for="pending-q">关键词</label>
            <input id="pending-q" placeholder="搜索片段内容">
          </div>
          <button type="button" class="secondary" id="pending-search-btn">刷新片段</button>
          <div></div>
        </div>
        <div id="pending-status" class="status"></div>
        <div id="pending-list" class="list"></div>
        </div>
      </section>
    </div>
    </div>
    <div class="footer-link">
      <a href="#config" id="config-link">配置</a>
    </div>
  </div>

  <script>
    const autoAnalyze = document.getElementById('auto-analyze');
    const mainTopbar = document.getElementById('main-topbar');
    const mainGrid = document.getElementById('main-grid');
    const knowledgeStatus = document.getElementById('knowledge-status');
    const pendingStatus = document.getElementById('pending-status');
    const configStatus = document.getElementById('config-status');
    const knowledgeList = document.getElementById('knowledge-list');
    const pendingList = document.getElementById('pending-list');
    const configSection = document.getElementById('config-section');
    const configForm = document.getElementById('config-form');
    const configLink = document.getElementById('config-link');
    const configBaseURL = document.getElementById('config-base-url');
    const configAPIKey = document.getElementById('config-api-key');
    const configModel = document.getElementById('config-model');
    const grid = document.querySelector('.grid');
    const pendingSection = document.getElementById('pending-section');
    const pendingContent = document.getElementById('pending-content');
    const togglePendingBtn = document.getElementById('toggle-pending-btn');
    const knowledgePrevBtn = document.getElementById('knowledge-prev-btn');
    const knowledgeNextBtn = document.getElementById('knowledge-next-btn');
    const knowledgePageInfo = document.getElementById('knowledge-page-info');
    const knowledgePageSize = 40;
    let knowledgePage = 1;
    let knowledgeTotal = 0;
    let pendingVisible = false;
    let pendingCount = 0;
    let settingsLoaded = false;

    function setStatus(el, text, kind) {
      el.textContent = text;
      el.className = `status show ${kind}`;
    }

    function clearStatus(el) {
      el.textContent = '';
      el.className = 'status';
    }

    function showConfigOnly(showOnlyConfig) {
      configSection.classList.toggle('hidden-block', !showOnlyConfig);
      mainTopbar.classList.toggle('hidden-block', showOnlyConfig);
      mainGrid.classList.toggle('hidden-block', showOnlyConfig);
    }

    function openConfigSection() {
      configSection.classList.remove('hidden-block');
      configSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function renderKnowledge(items) {
      if (!items.length) {
        knowledgeList.innerHTML = '<div class="muted">还没有已沉淀的知识。</div>';
        return;
      }
      knowledgeList.innerHTML = items.map(item => `
        <article class="item">
          <div class="item-top">
            <div>
              <h3>${escapeHtml(item.title)}</h3>
            </div>
            <details class="menu">
              <summary class="menu-trigger">...</summary>
              <div class="menu-panel">
                <button type="button" data-knowledge-action="edit" data-id="${escapeHtml(item.id)}">编辑</button>
                <button type="button" class="danger" data-knowledge-action="delete" data-id="${escapeHtml(item.id)}">删除</button>
              </div>
            </details>
          </div>
          <div class="meta">
            <span class="pill">${escapeHtml(item.status)}</span>
            <span class="pill">${escapeHtml(item.efficacy_source)}</span>
            ${item.source_name ? `<span class="pill">${escapeHtml(item.source_name)}</span>` : ''}
            <span class="pill">创建 ${escapeHtml(formatTime(item.created_at))}</span>
            <span class="pill">更新 ${escapeHtml(formatTime(item.updated_at))}</span>
          </div>
          ${item.problem ? `<p><strong>问题：</strong>${escapeHtml(item.problem)}</p>` : ''}
          <p><strong>方案：</strong></p>
          <div class="solution-body">${escapeHtml(item.solution_text)}</div>
          ${item.tags?.length ? `<div class="tags">${item.tags.map(tag => `<span class="pill">#${escapeHtml(tag)}</span>`).join('')}</div>` : ''}
          ${item.raw_content ? `
            <details class="inline-toggle">
              <summary>查看分析前原文</summary>
              <div class="preview">${escapeHtml(item.raw_content)}</div>
            </details>
          ` : ''}
          <form class="edit-form" data-edit-form="${escapeHtml(item.id)}" hidden>
            <div>
              <label>标题</label>
              <input name="title" value="${escapeHtml(item.title)}">
            </div>
            <div>
              <label>问题</label>
              <textarea name="problem">${escapeHtml(item.problem || '')}</textarea>
            </div>
            <div>
              <label>方案</label>
              <textarea name="solution_text">${escapeHtml(item.solution_text)}</textarea>
            </div>
            <div>
              <label>状态</label>
              <select name="status">
                <option value="draft" ${item.status === 'draft' ? 'selected' : ''}>draft</option>
                <option value="probable_success" ${item.status === 'probable_success' ? 'selected' : ''}>probable_success</option>
                <option value="confirmed_success" ${item.status === 'confirmed_success' ? 'selected' : ''}>confirmed_success</option>
                <option value="failed" ${item.status === 'failed' ? 'selected' : ''}>failed</option>
              </select>
            </div>
            <div>
              <label>标签</label>
              <input name="tags" value="${escapeHtml((item.tags || []).join(', '))}">
            </div>
            <div class="actions">
              <button type="submit">保存修改</button>
              <button type="button" class="secondary" data-knowledge-action="cancel" data-id="${escapeHtml(item.id)}">取消</button>
            </div>
          </form>
        </article>
      `).join('');
    }

    function renderPending(items) {
      if (!items.length) {
        pendingList.innerHTML = '<div class="muted">当前没有未分析片段。</div>';
        return;
      }
      pendingList.innerHTML = items.map(item => `
        <article class="item">
          <h3>片段 #${escapeHtml(item.id)}</h3>
          <div class="meta">
            <span class="pill">${escapeHtml(item.content_type)}</span>
            <span class="pill">${escapeHtml(item.char_count)} 字符</span>
            <span class="pill">${escapeHtml(item.line_count)} 行</span>
            <span class="pill">${escapeHtml(new Date(item.captured_at).toLocaleString())}</span>
          </div>
          <div class="preview">${escapeHtml(item.content)}</div>
          <div class="actions">
            <button type="button" data-action="analyze" data-id="${escapeHtml(item.id)}">分析</button>
            <button type="button" class="danger" data-action="delete" data-id="${escapeHtml(item.id)}">删除</button>
          </div>
        </article>
      `).join('');
    }

    function formatTime(value) {
      if (!value) return '-';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value;
      return date.toLocaleString();
    }

    function syncPendingVisibility() {
      pendingSection.classList.toggle('hidden-block', !pendingVisible);
      pendingContent.classList.toggle('hidden-block', !pendingVisible);
      grid.classList.toggle('single-column', !pendingVisible);
      togglePendingBtn.textContent = pendingVisible ? '隐藏未分析片段' : '显示未分析片段';
    }

    async function loadSettings() {
      const resp = await fetch('/api/v1/settings');
      if (!resp.ok) return;
      const data = await resp.json();
      settingsLoaded = true;
      autoAnalyze.checked = !!data.capture?.auto_analyze;
      configBaseURL.value = data.ai?.base_url || 'https://api.openai.com/v1';
      configAPIKey.value = data.ai?.api_key || '';
      configModel.value = data.ai?.model || 'gpt-4o-mini';
      showConfigOnly(!data.ai?.has_api_key);
      if (window.location.hash === '#config') {
        openConfigSection();
      }
    }

    async function saveSettings() {
      const resp = await fetch('/api/v1/settings', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          ai: {
            base_url: configBaseURL.value.trim(),
            api_key: configAPIKey.value.trim(),
            model: configModel.value.trim()
          },
          capture: {
            auto_analyze: autoAnalyze.checked
          }
        })
      });
      const data = await resp.json();
      if (!resp.ok) {
        setStatus(configStatus, data.error || '保存设置失败。', 'bad');
        return;
      }
      setStatus(configStatus, '配置已保存。', 'ok');
      configBaseURL.value = data.ai?.base_url || configBaseURL.value;
      configAPIKey.value = data.ai?.api_key || configAPIKey.value;
      configModel.value = data.ai?.model || configModel.value;
      autoAnalyze.checked = !!data.capture?.auto_analyze;
      if (data.ai?.has_api_key) {
        showConfigOnly(false);
      }
    }

    async function loadKnowledge() {
      clearStatus(knowledgeStatus);
      const params = new URLSearchParams({
        q: document.getElementById('knowledge-q').value.trim(),
        limit: String(knowledgePageSize),
        offset: String((knowledgePage - 1) * knowledgePageSize)
      });
      const resp = await fetch(`/api/v1/solutions?${params.toString()}`);
      if (!resp.ok) {
        setStatus(knowledgeStatus, '知识库加载失败。', 'bad');
        return;
      }
      const data = await resp.json();
      knowledgeTotal = data.total || 0;
      updateKnowledgePager(data.count || 0);
      setStatus(knowledgeStatus, `共 ${knowledgeTotal} 条知识`, 'ok');
      renderKnowledge(data.items || []);
    }

    function updateKnowledgePager(currentCount) {
      const totalPages = Math.max(1, Math.ceil(knowledgeTotal / knowledgePageSize));
      if (knowledgePage > totalPages) {
        knowledgePage = totalPages;
      }
      knowledgePageInfo.textContent = `第 ${knowledgePage} / ${totalPages} 页`;
      knowledgePrevBtn.disabled = knowledgePage <= 1;
      knowledgeNextBtn.disabled = knowledgePage >= totalPages || currentCount < knowledgePageSize;
    }

    async function loadPending() {
      clearStatus(pendingStatus);
      const params = new URLSearchParams({
        q: document.getElementById('pending-q').value.trim(),
        analyzed: 'false'
      });
      const resp = await fetch(`/api/v1/captures?${params.toString()}`);
      if (!resp.ok) {
        setStatus(pendingStatus, '未分析片段加载失败。', 'bad');
        return;
      }
      const data = await resp.json();
      pendingCount = data.count || 0;
      syncPendingVisibility();
      setStatus(pendingStatus, `共 ${data.count} 条未分析片段`, 'ok');
      renderPending(data.items || []);
    }

    async function analyzePending(id) {
      const resp = await fetch(`/api/v1/captures/${id}/analyze`, { method: 'POST' });
      const data = await resp.json();
      if (!resp.ok) {
        setStatus(pendingStatus, data.error || 'AI 分析失败。', 'bad');
        return;
      }
      const promote = await fetch(`/api/v1/captures/${id}/promote`, { method: 'POST' });
      const promoteData = await promote.json();
      if (!promote.ok && promote.status !== 409) {
        setStatus(pendingStatus, promoteData.error || '转为知识失败。', 'bad');
        return;
      }
      setStatus(pendingStatus, `片段 #${id} 已分析并沉淀。`, 'ok');
      loadPending();
      loadKnowledge();
    }

    async function deletePending(id) {
      const resp = await fetch(`/api/v1/captures/${id}`, { method: 'DELETE' });
      const data = await resp.json();
      if (!resp.ok) {
        setStatus(pendingStatus, data.error || '删除失败。', 'bad');
        return;
      }
      setStatus(pendingStatus, `片段 #${id} 已删除。`, 'ok');
      loadPending();
    }

    async function clearPending() {
      const resp = await fetch('/api/v1/captures', { method: 'DELETE' });
      const data = await resp.json();
      if (!resp.ok) {
        setStatus(pendingStatus, data.error || '清空失败。', 'bad');
        return;
      }
      setStatus(pendingStatus, `已清空 ${data.deleted || 0} 条未分析片段。`, 'ok');
      loadPending();
    }

    function collectTags(raw) {
      return raw.split(',').map(v => v.trim()).filter(Boolean);
    }

    async function updateKnowledge(id, form) {
      const payload = {
        title: form.title.value.trim(),
        problem: form.problem.value.trim(),
        solution_text: form.solution_text.value.trim(),
        status: form.status.value,
        tags: collectTags(form.tags.value)
      };
      const resp = await fetch(`/api/v1/solutions/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await resp.json();
      if (!resp.ok) {
        setStatus(knowledgeStatus, data.error || '保存知识失败。', 'bad');
        return;
      }
      setStatus(knowledgeStatus, `知识 #${id} 已更新。`, 'ok');
      loadKnowledge();
    }

    async function deleteKnowledge(id) {
      const resp = await fetch(`/api/v1/solutions/${id}`, { method: 'DELETE' });
      const data = await resp.json();
      if (!resp.ok) {
        setStatus(knowledgeStatus, data.error || '删除知识失败。', 'bad');
        return;
      }
      setStatus(knowledgeStatus, `知识 #${id} 已删除。`, 'ok');
      loadKnowledge();
    }

    function toggleEditForm(id, show) {
      document.querySelectorAll('[data-edit-form]').forEach(form => {
        if (form.dataset.editForm !== String(id)) {
          form.hidden = true;
        }
      });
      const form = document.querySelector(`[data-edit-form="${id}"]`);
      if (!form) return;
      form.hidden = !show;
    }

    function debounce(fn, wait) {
      let timer = null;
      return (...args) => {
        clearTimeout(timer);
        timer = setTimeout(() => fn(...args), wait);
      };
    }

    const debouncedLoadKnowledge = debounce(loadKnowledge, 500);
    const debouncedLoadPending = debounce(loadPending, 500);

    autoAnalyze.addEventListener('change', saveSettings);
    configForm.addEventListener('submit', (event) => {
      event.preventDefault();
      saveSettings();
    });
    configLink.addEventListener('click', (event) => {
      event.preventDefault();
      if (!settingsLoaded) return;
      showConfigOnly(false);
      openConfigSection();
    });
    document.getElementById('knowledge-search-btn').addEventListener('click', loadKnowledge);
    document.getElementById('pending-search-btn').addEventListener('click', loadPending);
    document.getElementById('knowledge-q').addEventListener('input', () => {
      knowledgePage = 1;
      debouncedLoadKnowledge();
    });
    document.getElementById('pending-q').addEventListener('input', debouncedLoadPending);
    document.getElementById('clear-pending-btn').addEventListener('click', clearPending);
    knowledgePrevBtn.addEventListener('click', () => {
      if (knowledgePage <= 1) return;
      knowledgePage -= 1;
      loadKnowledge();
    });
    knowledgeNextBtn.addEventListener('click', () => {
      knowledgePage += 1;
      loadKnowledge();
    });
    togglePendingBtn.addEventListener('click', () => {
      pendingVisible = !pendingVisible;
      syncPendingVisibility();
    });
    knowledgeList.addEventListener('click', (event) => {
      const button = event.target.closest('button[data-knowledge-action]');
      if (!button) return;
      const id = button.dataset.id;
      const action = button.dataset.knowledgeAction;
      if (action === 'edit') toggleEditForm(id, true);
      if (action === 'cancel') toggleEditForm(id, false);
      if (action === 'delete') deleteKnowledge(id);
    });
    knowledgeList.addEventListener('submit', (event) => {
      const form = event.target.closest('form[data-edit-form]');
      if (!form) return;
      event.preventDefault();
      const id = form.dataset.editForm;
      updateKnowledge(id, form);
    });
    pendingList.addEventListener('click', (event) => {
      const button = event.target.closest('button[data-action]');
      if (!button) return;
      const id = button.dataset.id;
      if (button.dataset.action === 'analyze') analyzePending(id);
      if (button.dataset.action === 'delete') deletePending(id);
    });

    loadSettings();
    loadKnowledge();
    loadPending();
    if (window.location.hash === '#pending-section') {
      pendingVisible = true;
      syncPendingVisibility();
      document.querySelector('#pending-section')?.scrollIntoView({ behavior: 'smooth' });
    }
  </script>
</body>
</html>
